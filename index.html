<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Windy Bird</title>
<style>
html,body{margin:0;height:100%;background:#070b18;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center}
canvas{border-radius:16px;box-shadow:0 12px 50px #000b}
</style></head><body><canvas id="c"></canvas><script>
const W=400,H=640,G=90,GY=H-G,GAP=152,PW=66,BX=110;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const dpr=Math.min(window.devicePixelRatio||1,2);
cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
addEventListener('resize',fit);fit();
const FONT='"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif';
const R=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let best=0;try{best=+localStorage.getItem('windybest')||0}catch(e){}

/* 하늘 팔레트: 낮 → 노을 → 밤 → 폭풍 */
const PAL=[[[88,188,255],[205,238,255]],[[92,70,160],[255,170,108]],[[8,12,40],[44,56,120]],[[44,62,74],[132,150,160]]];
const mix=(a,b,f)=>a.map((v,i)=>Math.round(v+(b[i]-v)*f));
const rgb=c=>`rgb(${c[0]},${c[1]},${c[2]})`;

let state='ready',t=0,score=0,wind=0,phaseP=0,shake=0,deadAt=0,banner=0,lastLevel=0;
let bird={y:H/2-20,vy:0,flap:0,rot:0},pipes=[],dist=0,parts=[],sc1=0,sc2=0,gs=0;
const clouds=Array.from({length:7},()=>({x:R(0,W),y:R(40,300),s:R(.6,1.4)}));
const streaks=Array.from({length:22},()=>({x:R(0,W),y:R(0,GY),l:R(20,60)}));
const stars=Array.from({length:60},()=>({x:R(0,W),y:R(0,GY*.7),r:R(.5,1.6),p:R(0,6)}));

const level=()=>Math.floor(score/10);
const amp=()=>3+level()*.7;                 // 바람 최대 세기: 10점마다 증가
const mult=()=>Math.max(.35,1+wind*.13);     // 바람 → 진행 속도 배율
function updateWind(){
  const A=amp();
  wind=A*(.62*Math.sin(t*.45)+.38*Math.sin(t*1.17+2));
}

/* 소리 */
let AC;function beep(f,d,ty='sine',v=.07){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.value=v;
g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}

function reset(){bird={y:H/2-20,vy:0,flap:0,rot:0};pipes=[];dist=0;score=0;parts=[];lastLevel=0;banner=0;phaseP=0}
function flap(){
  if(state==='ready'){state='play';reset2()}
  if(state==='play'){bird.vy=-7.4;bird.flap=1;beep(520,.1,'triangle');
    for(let i=0;i<5;i++)parts.push({x:BX-10,y:bird.y+8,vx:R(-2,-.5),vy:R(-.5,1.5),l:1,c:'255,255,255',r:R(2,4)})}
  else if(state==='dead'&&t-deadAt>.5){reset();state='ready'}
}
function reset2(){reset();state='play';spawn(W+60)}
function spawn(x){const top=R(80,GY-GAP-70);pipes.push({x,top,passed:false})}
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();flap()}});
cv.addEventListener('pointerdown',e=>{e.preventDefault();flap()});

function die(){
  if(state!=='play')return;state='dead';deadAt=t;shake=14;beep(140,.4,'sawtooth',.1);
  if(score>best){best=score;try{localStorage.setItem('windybest',best)}catch(e){}}
  for(let i=0;i<22;i++)parts.push({x:BX,y:bird.y,vx:R(-4,4),vy:R(-5,2),l:1,c:'255,210,60',r:R(2,5)});
}

function update(dt){
  t+=.0167*dt;updateWind();
  const sm=state==='play'?mult():1+wind*.06;
  const sp=2.7*sm*dt;
  phaseP+=((score/10)-phaseP)*.02*dt;
  if(shake>0)shake-=.8*dt;
  if(state!=='dead'){sc1+=sp*.12;sc2+=sp*.3;gs+=sp}
  clouds.forEach(c=>{c.x-=(sp*.18+wind*.05)*c.s;if(c.x<-120)c.x=W+100;if(c.x>W+130)c.x=-110});
  streaks.forEach(s=>{s.x+=wind*2.2*dt;if(s.x>W+60)s.x=-60;if(s.x<-60)s.x=W+60});
  if(bird.flap>0)bird.flap-=.05*dt;
  if(state==='ready'){bird.y=H/2-20+Math.sin(t*4)*8;bird.rot=0}
  else{
    bird.vy+=.42*dt;bird.y+=bird.vy*dt;
    bird.rot=clamp(bird.vy*.07,-.5,1.3);
    if(bird.y<14){bird.y=14;bird.vy=0}
    if(bird.y>GY-13){bird.y=GY-13;die()}
  }
  if(state==='play'){
    dist+=sp;
    pipes.forEach(p=>{p.x-=sp;
      if(!p.passed&&p.x+PW<BX-12){p.passed=true;score++;beep(880,.12,'square',.05);
        if(score%10===0){banner=2.2;beep(440,.3,'sawtooth',.06);setTimeout(()=>beep(660,.3,'sawtooth',.06),120)}}
      const bx=BX,by=bird.y,r=12;
      if(bx+r>p.x&&bx-r<p.x+PW&&(by-r<p.top||by+r>p.top+GAP))die();
    });
    if(pipes.length&&pipes[0].x<-PW-20)pipes.shift();
    if(pipes.length&&pipes[pipes.length-1].x<W-215)spawn(W+20);
    if(banner>0)banner-=.0167*dt;
  }
  if(state==='dead'){bird.rot=Math.min(1.5,bird.rot+.06*dt)}
  parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.08*dt;p.l-=.025*dt});
  parts=parts.filter(p=>p.l>0);
}

/* ---------- 그리기 ---------- */
function sky(){
  const n=Math.floor(phaseP),f=phaseP-n,a=PAL[n%4],b=PAL[(n+1)%4];
  const top=mix(a[0],b[0],f),bot=mix(a[1],b[1],f);
  const g=ctx.createLinearGradient(0,0,0,GY);g.addColorStop(0,rgb(top));g.addColorStop(1,rgb(bot));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const night=(n%4===2?1-f:n%4===1?f:0)*1;
  if(night>0){ctx.fillStyle='#fff';stars.forEach(s=>{ctx.globalAlpha=night*(.5+.5*Math.sin(t*3+s.p));ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()});ctx.globalAlpha=1}
  // 해/달
  const sx=300,sy=120+ (n%4===1?f*60:0);
  const dayFade=(n%4===0?1-f*.3:n%4===1?.7-f*.7:n%4===2?f*.0:0);
  const moon=(n%4===2)?1:(n%4===1?f:0);
  const rg=ctx.createRadialGradient(sx,sy,5,sx,sy,90);
  rg.addColorStop(0,moon>.5?'rgba(220,230,255,.5)':'rgba(255,240,170,.8)');rg.addColorStop(1,'rgba(255,240,170,0)');
  if(n%4!==3){ctx.fillStyle=rg;ctx.fillRect(sx-100,sy-100,200,200);
    ctx.fillStyle=moon>.5?'#e8eeff':'#fff4b0';ctx.beginPath();ctx.arc(sx,sy,24,0,7);ctx.fill()}
}
function mount(off,base,a,col,sc){
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,GY);
  for(let x=0;x<=W;x+=6){const X=x+sc;ctx.lineTo(x,base-a*(.55+.3*Math.sin(X*.011+off)+.15*Math.sin(X*.031+off*2)))}
  ctx.lineTo(W,GY);ctx.fill();
}
function drawCloud(c){
  ctx.save();ctx.translate(c.x,c.y);ctx.scale(c.s,c.s);
  ctx.fillStyle='rgba(255,255,255,.75)';
  [[0,0,26],[28,-8,32],[58,0,24],[30,8,28]].forEach(a=>{ctx.beginPath();ctx.arc(a[0],a[1],a[2],0,7);ctx.fill()});
  ctx.restore();
}
function drawPipe(p){
  const g=ctx.createLinearGradient(p.x,0,p.x+PW,0);
  g.addColorStop(0,'#2a7a1c');g.addColorStop(.35,'#8be35a');g.addColorStop(.7,'#4fb52e');g.addColorStop(1,'#256b18');
  const cap=(y)=>{ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(p.x-6,y,PW+12,28,6);ctx.fill();
    ctx.strokeStyle='rgba(0,40,0,.55)';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(p.x+2,y+4,6,20)};
  ctx.fillStyle=g;
  ctx.fillRect(p.x,0,PW,p.top-24);ctx.fillRect(p.x,p.top+GAP+24,PW,GY-p.top-GAP-24);
  ctx.strokeStyle='rgba(0,40,0,.5)';ctx.lineWidth=2;
  ctx.strokeRect(p.x,-2,PW,p.top-22);ctx.strokeRect(p.x,p.top+GAP+26,PW,GY);
  cap(p.top-28);cap(p.top+GAP);
}
function drawBird(){
  ctx.save();ctx.translate(BX,bird.y);ctx.rotate(bird.rot);
  const wing=Math.sin(t*28)*(bird.flap>0||state==='ready'?1:.25);
  // 꼬리
  ctx.fillStyle='#ff9d00';ctx.beginPath();ctx.moveTo(-14,0);ctx.lineTo(-26,-5);ctx.lineTo(-24,3);ctx.lineTo(-26,9);ctx.lineTo(-13,6);ctx.fill();
  // 몸
  let g=ctx.createRadialGradient(-4,-6,2,0,0,20);g.addColorStop(0,'#fff09a');g.addColorStop(.6,'#ffc928');g.addColorStop(1,'#f59a00');
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,18,14,0,0,7);ctx.fill();
  ctx.strokeStyle='#9a5a00';ctx.lineWidth=2;ctx.stroke();
  // 배
  ctx.fillStyle='#fff6cf';ctx.beginPath();ctx.ellipse(3,7,10,5,.1,0,7);ctx.fill();
  // 날개
  ctx.save();ctx.translate(-5,2);ctx.rotate(wing*.7-.2);
  ctx.fillStyle='#ffb21a';ctx.strokeStyle='#9a5a00';ctx.beginPath();ctx.ellipse(-4,0,11,6,0,0,7);ctx.fill();ctx.stroke();ctx.restore();
  // 눈
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(8,-5,6,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(10,-5,2.6,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(11,-6,.9,0,7);ctx.fill();
  // 부리
  ctx.fillStyle='#ff5a2a';ctx.beginPath();ctx.moveTo(14,0);ctx.quadraticCurveTo(26,-1,24,3);ctx.quadraticCurveTo(22,7,13,6);ctx.fill();
  ctx.strokeStyle='#8a2a0a';ctx.lineWidth=1.5;ctx.stroke();
  ctx.restore();
}
function drawGround(){
  const g=ctx.createLinearGradient(0,GY,0,H);g.addColorStop(0,'#e0c88a');g.addColorStop(1,'#a8884a');
  ctx.fillStyle=g;ctx.fillRect(0,GY,W,G);
  ctx.fillStyle='#6fcf3f';ctx.fillRect(0,GY,W,14);
  ctx.fillStyle='#4aa52a';ctx.fillRect(0,GY+14,W,4);
  ctx.fillStyle='rgba(60,120,30,.55)';
  for(let x=-(gs%24);x<W+24;x+=24){ctx.beginPath();ctx.moveTo(x,GY+14);ctx.lineTo(x+12,GY+2);ctx.lineTo(x+24,GY+14);ctx.fill()}
  ctx.fillStyle='rgba(120,90,40,.35)';
  for(let x=-(gs%40);x<W+40;x+=40){ctx.fillRect(x,GY+36,18,5);ctx.fillRect(x+20,GY+58,12,5)}
}
function drawFlag(){
  // 패널
  ctx.fillStyle='rgba(10,16,40,.45)';ctx.beginPath();ctx.roundRect(8,8,132,122,14);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=1.5;ctx.stroke();
  const px=74,ty=34,by=96;
  // 깃대
  const pg=ctx.createLinearGradient(px-3,0,px+3,0);pg.addColorStop(0,'#ddd');pg.addColorStop(1,'#777');
  ctx.fillStyle=pg;ctx.fillRect(px-2,ty-2,4,by-ty+2);
  ctx.fillStyle='#ffd24a';ctx.beginPath();ctx.arc(px,ty-4,4.5,0,7);ctx.fill();
  ctx.fillStyle='#555';ctx.fillRect(px-9,by,18,4);
  // 깃발 천
  const dir=wind>=0?1:-1,aw=Math.abs(wind),a=Math.min(1,aw/4.5);
  const len=12+Math.min(1,aw/9)*44,N=14,hh=22;
  const pt=(i,f)=>{const u=i/N;
    const x=px+dir*(u*len);
    const y=ty+2+f*hh*(1-.2*u)+(1-a)*u*u*26*(.4+f*.6)+Math.sin(t*(4+aw*2.2)-u*6)*(1.5+a*6)*u;
    return[x,y]};
  const band=(f0,f1,col)=>{ctx.fillStyle=col;ctx.beginPath();
    for(let i=0;i<=N;i++){const p=pt(i,f0);i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])}
    for(let i=N;i>=0;i--){const p=pt(i,f1);ctx.lineTo(p[0],p[1])}ctx.fill()};
  band(0,1,'#e8344a');band(.38,.62,'#fff');
  ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=1;
  ctx.beginPath();for(let i=0;i<=N;i++){const p=pt(i,0);i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])}ctx.stroke();
  // 수치
  ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font=`18px ${FONT}`;
  const arrow=aw<.4?'':(wind>0?'  ▶ 순풍':'  ◀ 맞바람');
  ctx.fillText(`바람 ${aw.toFixed(1)}`,74,118);
  ctx.font=`11px ${FONT}`;ctx.fillStyle=wind>0?'#9dffb0':'#ffb4a8';
  ctx.fillText(`속도 ×${mult().toFixed(2)}${arrow}`,74,22);
}
function txt(s,x,y,size,col='#fff',stroke='rgba(0,0,0,.55)'){
  ctx.font=`${size}px ${FONT}`;ctx.textAlign='center';ctx.lineJoin='round';
  ctx.lineWidth=size/5;ctx.strokeStyle=stroke;ctx.strokeText(s,x,y);ctx.fillStyle=col;ctx.fillText(s,x,y);
}
function draw(){
  ctx.save();
  if(shake>0)ctx.translate(R(-shake,shake)*.5,R(-shake,shake)*.5);
  sky();
  clouds.forEach(drawCloud);
  mount(0,GY-60,150,'rgba(70,90,150,.45)',sc1);
  mount(3,GY-10,110,'rgba(40,100,90,.6)',sc2);
  // 바람 줄무늬
  const sa=Math.min(1,Math.abs(wind)/6);
  ctx.strokeStyle=`rgba(255,255,255,${.12+sa*.4})`;ctx.lineWidth=1.5;ctx.lineCap='round';
  streaks.forEach(s=>{const d=wind>=0?1:-1,l=s.l*(.3+sa);ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.quadraticCurveTo(s.x+d*l*.5,s.y-4,s.x+d*l,s.y);ctx.stroke()});
  pipes.forEach(drawPipe);
  drawGround();
  parts.forEach(p=>{ctx.fillStyle=`rgba(${p.c},${p.l})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.l,0,7);ctx.fill()});
  drawBird();
  drawFlag();
  if(state!=='ready')txt(score,W/2+34,76,56);
  if(state==='ready'){
    txt('WINDY BIRD',W/2,190,50,'#ffe066');
    txt('바람을 읽고 날아라!',W/2,235,22);
    txt('탭 · 스페이스로 시작',W/2,GY-70,20);
    txt('깃발이 바람의 세기를 알려줘요',W/2,GY-40,15,'#d8ecff');
    txt(`최고 기록 ${best}`,W/2,GY-14-0,16,'#fff');
  }
  if(banner>0){ctx.globalAlpha=Math.min(1,banner);txt(`바람이 거세진다!  Lv.${level()}`,W/2,170,26,'#ffd0a0');ctx.globalAlpha=1}
  if(state==='dead'){
    ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,W,H);
    const g=ctx.createLinearGradient(0,220,0,420);g.addColorStop(0,'#fff6d8');g.addColorStop(1,'#f3d88e');
    ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(60,210,280,210,20);ctx.fill();
    ctx.strokeStyle='#7a5a1a';ctx.lineWidth=4;ctx.stroke();
    txt('GAME OVER',W/2,180,40,'#ff6a5a');
    ctx.fillStyle='#5a3a0a';ctx.font=`20px ${FONT}`;ctx.textAlign='center';
    ctx.fillText('점수',130,260);ctx.fillText('최고',270,260);
    ctx.font=`52px ${FONT}`;ctx.fillText(score,130,320);ctx.fillText(best,270,320);
    ctx.font=`16px ${FONT}`;ctx.fillText(`바람 Lv.${level()} 까지 도달`,W/2,360);
    if(t-deadAt>.5)txt('탭하여 다시 시작',W/2,460,22);
  }
  ctx.restore();
}
let last=performance.now();
function loop(now){const dt=Math.min(2.5,(now-last)/16.667);last=now;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
